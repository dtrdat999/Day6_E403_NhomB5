name: Build Moni Prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/moni-prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codebase/moni-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build prototype
        run: npm run build
        env:
          VITE_BASE_PATH: /Day6_E403_Moniii/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
